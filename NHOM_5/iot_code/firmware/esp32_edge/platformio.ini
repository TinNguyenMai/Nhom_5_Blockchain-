[platformio]
default_envs = esp32dev_ai
src_dir = main
# Keep generated build paths free of spaces; sdkconfig also disables macro path maps.
build_dir = ${sysenv.USERPROFILE}/.platformio/build/solar_edge_ai

[env:esp32dev_ai]
platform = espressif32@6.13.0
board = esp32dev
# Match ESP-IDF's partitions_singleapp_large.csv (factory app: 1500K).
board_upload.maximum_size = 1536000
framework = espidf
monitor_speed = 115200
upload_speed = 460800
