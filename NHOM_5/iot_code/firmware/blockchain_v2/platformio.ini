[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
lib_ldf_mode = deep+
monitor_speed = 115200
upload_speed = 460800

lib_deps =
    adafruit/Adafruit INA219@^1.2.3
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
    knolleary/PubSubClient@^2.8
    milesburton/DallasTemperature@^3.11.0
